name: Android build
on:
  push:
    branches:
      - arena/a0ed6006-pass
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iphone-launcher-apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner already includes the Android SDK.
      - name: Build Android APK
        run: |
          if ! ./gradlew --no-daemon assembleDebug > "$RUNNER_TEMP/gradle-build.log" 2>&1; then
            cat "$RUNNER_TEMP/gradle-build.log"
            echo "::error title=Gradle build failed::$(tail -30 "$RUNNER_TEMP/gradle-build.log" | tr '\n' ' ' | sed 's/%/%25/g')"
            exit 1
          fi
          tail -20 "$RUNNER_TEMP/gradle-build.log"
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -la "$APK"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | head -n 1)
          "$AAPT" dump badging "$APK" | head -n 12
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-launcher-18-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ./iPhone-Launcher-18.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iphone-launcher-v1.0
          name: iPhone Launcher 18 v1.0
          body: |
            iPhone Launcher 18 — iOS style launcher for Android 10 to 17+.

            Features: iOS home screen, Dynamic Island, Control Center, Notification Center (top shutter), iOS volume panel, AssistiveTouch, iOS lock screen + passcode, 50 iPhone wallpapers, Light/Dark/Tinted icons, Spotlight search, App Library, folders, iOS Calculator / Notes / Clock / Weather.

            Install: download `iPhone-Launcher-18.apk` on your phone, open it, allow "install unknown apps", then open the app and follow the setup.
          files: iPhone-Launcher-18.apk
