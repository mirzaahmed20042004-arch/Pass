name: Build Safe Guard APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK_MGR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
            "$SDK_MGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null 2>&1 || true
          fi
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate release keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v -keystore keystore/safeguard-release.jks \
            -alias safeguard -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass safeguard -keypass safeguard \
            -dname "CN=Safe Guard, OU=SignalDisruptor Pro, O=SafeGuard, L=Karachi, C=PK"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log | tail -n 60

      - name: Build signed release APK
        env:
          SG_KEYSTORE_PATH: ${{ github.workspace }}/keystore/safeguard-release.jks
          SG_KEYSTORE_PASSWORD: safeguard
          SG_KEY_ALIAS: safeguard
          SG_KEY_PASSWORD: safeguard
        run: gradle :app:assembleRelease --stacktrace

      - name: Publish build log on failure
        if: failure()
        run: |
          grep -vE "^(Download|> Task|Checking the license|Starting a Gradle)" build.log | tail -n 260 > /tmp/build-error.log
          set +e
          git config user.email "ci@users.noreply.github.com"
          git config user.name "CI Diagnostics"
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          cp /tmp/build-error.log ci-build-error.log
          git add -f ci-build-error.log
          git commit -m "ci: build diagnostics [skip ci]"
          # retry push in case another run committed first
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/SafeGuard-v1.1.0-debug.apk
          cp app/build/outputs/apk/release/app-release.apk artifacts/SafeGuard-v1.1.0-release.apk
          ls -lh artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: safeguard-apks
          path: artifacts/*.apk
          retention-days: 90

      - name: Publish download release
        if: github.ref == 'refs/heads/arena/481d206d-pass' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Safe Guard v1.1.0 (SignalDisruptor Pro)
          body: |
            **Safe Guard** — RF diagnostics & resilience testing build.

            Install `SafeGuard-v1.1.0-release.apk` (signed) or the debug APK.
            Requires Android 8.0+ (API 26).
          files: artifacts/*.apk
          fail_on_unmatched_files: false

  emulator-smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: safeguard-apks
          path: artifacts

      - name: Boot emulator, install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            adb install -r artifacts/SafeGuard-v1.1.0-release.apk
            adb shell pm grant com.safeguard.app android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant com.safeguard.app android.permission.POST_NOTIFICATIONS || true
            adb shell am start -n com.safeguard.app/.MainActivity
            sleep 12
            adb shell screencap -p /sdcard/shot.png
            adb pull /sdcard/shot.png screenshot-dashboard.png
            adb shell dumpsys activity activities | grep -i "com.safeguard.app" | head -5
            adb logcat -d -s AndroidRuntime:E | tail -20
            adb shell pidof com.safeguard.app

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: safeguard-screenshot
          path: screenshot-dashboard.png
