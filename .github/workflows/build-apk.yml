name: Build Safe Guard APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK_MGR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
            "$SDK_MGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null 2>&1 || true
          fi
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore or create release keystore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p keystore
          rm -f keystore/safeguard-release.jks
          # A stable signing key matters: with a brand-new key every run, Android
          # rejects the update ("App not installed") and users stay on an old build.
          gh api "repos/$GITHUB_REPOSITORY/contents/keystore/safeguard-release.jks?ref=$GITHUB_REF_NAME" \
            --jq .content 2>/dev/null | tr -d '\n' | base64 -d > keystore/safeguard-release.jks || true
          if [ -s keystore/safeguard-release.jks ] && keytool -list -keystore keystore/safeguard-release.jks -storepass safeguard >/dev/null 2>&1; then
            echo "restored persisted keystore"
          else
            rm -f keystore/safeguard-release.jks
            keytool -genkeypair -keystore keystore/safeguard-release.jks \
              -alias safeguard -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass safeguard -keypass safeguard \
              -dname "CN=Safe Guard, OU=SignalDisruptor Pro, O=SafeGuard, L=Karachi, C=PK"
            B64=$(base64 -w 0 keystore/safeguard-release.jks)
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/keystore/safeguard-release.jks" \
              -f message="ci: persist signing keystore [skip ci]" \
              -f content="$B64" -f branch="$GITHUB_REF_NAME" > /dev/null \
              && echo "keystore persisted for future update builds" \
              || echo "WARNING: could not persist keystore; this build is self-signed only"
          fi

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log | tail -n 60

      - name: Build signed release APK
        env:
          SG_KEYSTORE_PATH: ${{ github.workspace }}/keystore/safeguard-release.jks
          SG_KEYSTORE_PASSWORD: safeguard
          SG_KEY_ALIAS: safeguard
          SG_KEY_PASSWORD: safeguard
        run: gradle :app:assembleRelease --stacktrace

      - name: Publish build log on failure
        if: failure()
        run: |
          grep -vE "^(Download|> Task|Checking the license|Starting a Gradle)" build.log | tail -n 260 > /tmp/build-error.log
          set +e
          git config user.email "ci@users.noreply.github.com"
          git config user.name "CI Diagnostics"
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          cp /tmp/build-error.log ci-build-error.log
          git add -f ci-build-error.log
          git commit -m "ci: build diagnostics [skip ci]"
          # retry push in case another run committed first
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/SafeGuard-v1.3.1-debug.apk
          cp app/build/outputs/apk/release/app-release.apk artifacts/SafeGuard-v1.3.1-release.apk
          ls -lh artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: safeguard-apks
          path: artifacts/*.apk
          retention-days: 90

      - name: Publish download release
        if: github.ref == 'refs/heads/arena/481d206d-pass' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: Safe Guard v1.3.1 (SignalDisruptor Pro)
          body: |
            **Safe Guard** — RF diagnostics & resilience testing build.

            Install `SafeGuard-v1.3.1-release.apk` (signed) or the debug APK.
            Requires Android 8.0+ (API 26).
          files: artifacts/*.apk
          fail_on_unmatched_files: false

  emulator-smoke-test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: safeguard-apks
          path: artifacts

      - name: Boot emulator, install and launch
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            adb install -r artifacts/SafeGuard-v1.3.1-release.apk
            adb shell pm grant com.safeguard.app android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant com.safeguard.app android.permission.POST_NOTIFICATIONS || true
            adb shell am start -W -n com.safeguard.app/.MainActivity
            sleep 10
            adb shell screencap -p /sdcard/shot.png
            adb pull /sdcard/shot.png "$GITHUB_WORKSPACE/screenshot-dashboard.png" || true
            adb shell am start -n com.safeguard.app/.MainActivity --es screen tools || true
            sleep 10
            adb shell screencap -p /sdcard/tools.png
            adb pull /sdcard/tools.png "$GITHUB_WORKSPACE/screenshot-tools.png" || true
            adb shell am start -n com.safeguard.app/.ui.RadioControlActivity || true
            sleep 6
            adb shell screencap -p /sdcard/controls.png
            adb pull /sdcard/controls.png "$GITHUB_WORKSPACE/screenshot-radio-controls.png" || true
            adb logcat -d > "$GITHUB_WORKSPACE/full-logcat.txt" || true
            grep -iE "AndroidRuntime|FATAL|safeguard|VpnService|ShieldVpn" "$GITHUB_WORKSPACE/full-logcat.txt" | tail -n 150 > "$GITHUB_WORKSPACE/ci-crashlog.txt" || true
            echo "--- files captured ---" >> "$GITHUB_WORKSPACE/ci-crashlog.txt"
            ls -la "$GITHUB_WORKSPACE"/*.png >> "$GITHUB_WORKSPACE/ci-crashlog.txt" 2>&1

      - name: Publish screenshots + crash log via API
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUNLOG=/tmp/upload.log
          : > $RUNLOG
          push_file () {
            local path="$1" file="$2"
            if [ ! -s "$file" ]; then echo "SKIP $path (missing $file)" >> $RUNLOG; return 0; fi
            local b64 sha
            b64=$(base64 -w 0 "$file")
            sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$GITHUB_REF_NAME" --jq .sha 2>/dev/null)
            if [ -n "$sha" ]; then
              gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
                -f message="ci: update $path [skip ci]" -f content="$b64" -f sha="$sha" \
                -f branch="$GITHUB_REF_NAME" >> $RUNLOG 2>&1 && echo "OK update $path" >> $RUNLOG || echo "FAIL update $path" >> $RUNLOG
            else
              gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
                -f message="ci: add $path [skip ci]" -f content="$b64" \
                -f branch="$GITHUB_REF_NAME" >> $RUNLOG 2>&1 && echo "OK add $path" >> $RUNLOG || echo "FAIL add $path" >> $RUNLOG
            fi
          }
          push_file "docs/screenshots/dashboard.png" screenshot-dashboard.png
          push_file "docs/screenshots/tools.png" screenshot-tools.png
          push_file "docs/screenshots/radio-controls.png" screenshot-radio-controls.png
          {
            echo "--- upload results ---"
            cat $RUNLOG
            echo "--- local files ---"
            ls -la *.png 2>/dev/null
          } >> ci-crashlog.txt
          push_file "ci-crashlog.txt" ci-crashlog.txt
          exit 0

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safeguard-screenshot
          path: |
            screenshot-dashboard.png
            screenshot-radio-controls.png
            ci-crashlog.txt
