name: Build OmniDrive Android APK

on:
  push:
    branches:
      - 'arena/17e83096-pass'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Android SDK & install Platform 34
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_MGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          if [ -n "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
            "$SDK_MGR" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          fi
          ls -la "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Install backend & frontend dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Build web assets & sync Capacitor Android
        run: |
          cd frontend
          npm run build
          npx cap sync android

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/omnidrive-release.jks \
            -alias omnidrive \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass omnidrive2026 -keypass omnidrive2026 \
            -dname "CN=OmniDrive, OU=Mobile, O=OmniDrive, L=Karachi, C=PK"

      - name: Build signed Release APK
        env:
          OMNIDRIVE_KEYSTORE_PATH: /tmp/omnidrive-release.jks
          OMNIDRIVE_KEYSTORE_PASS: omnidrive2026
          OMNIDRIVE_KEY_ALIAS: omnidrive
          OMNIDRIVE_KEY_PASS: omnidrive2026
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify & package APK
        run: |
          mkdir -p release-artifacts
          APK_SRC="frontend/android/app/build/outputs/apk/release/app-release.apk"
          cp "$APK_SRC" release-artifacts/OmniDrive-Vehicle-Sounds.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose release-artifacts/OmniDrive-Vehicle-Sounds.apk
          fi
          ls -lh release-artifacts/OmniDrive-Vehicle-Sounds.apk
          sha256sum release-artifacts/OmniDrive-Vehicle-Sounds.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniDrive-Vehicle-Sounds-APK
          path: release-artifacts/OmniDrive-Vehicle-Sounds.apk
          retention-days: 90

      - name: Publish Direct Download GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0-omnidrive"
          gh release delete "$TAG" -y 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            release-artifacts/OmniDrive-Vehicle-Sounds.apk \
            --target "${{ github.sha }}" \
            --title "OmniDrive Vehicle Sounds v1.0.0 (Android APK)" \
            --notes "Direct Android APK download for OmniDrive Vehicle Sounds — 20 Vehicles, 30 Tap-to-Loop Real Sounds (Supra 2JZ & Turbo Flutter, Supercar, Car Driving & Horn, Bike & Horn, Police Car & Siren, Ambulance & Siren, Fire Brigade, Truck, Bus, Helicopter, Planes, Drone, Train, Speedboat & more)."
